<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg"><title>片区总量按站点份额拆分</title><desc>两条 100% 堆叠条分别是借出与归还的份额，逐站相减得到净流。</desc><text x="40" y="24" font-size="12.5" fill="#6f7887">片区 0 · 09-22 07:00 · 同一个总量，按「借出份额」和「归还份额」各切一次</text><rect x="40.0" y="52" width="76.9" height="32" fill="#0d9488" opacity="0.88"/><text x="78.5" y="72" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="700">3014</text><line x1="116.9" y1="52" x2="116.9" y2="84" stroke="#fff" stroke-width="1.5"/><rect x="116.9" y="52" width="41.7" height="32" fill="#2563eb" opacity="0.88"/><line x1="158.6" y1="52" x2="158.6" y2="84" stroke="#fff" stroke-width="1.5"/><rect x="158.6" y="52" width="39.4" height="32" fill="#7c3aed" opacity="0.88"/><line x1="198.0" y1="52" x2="198.0" y2="84" stroke="#fff" stroke-width="1.5"/><rect x="198.0" y="52" width="32.3" height="32" fill="#ea580c" opacity="0.88"/><line x1="230.3" y1="52" x2="230.3" y2="84" stroke="#fff" stroke-width="1.5"/><rect x="230.3" y="52" width="31.1" height="32" fill="#c026d3" opacity="0.88"/><line x1="261.5" y1="52" x2="261.5" y2="84" stroke="#fff" stroke-width="1.5"/><rect x="261.5" y="52" width="24.1" height="32" fill="#b45309" opacity="0.88"/><line x1="285.6" y1="52" x2="285.6" y2="84" stroke="#fff" stroke-width="1.5"/><rect x="285.6" y="52" width="146.4" height="32" fill="#dde1e8"/><text x="358.8" y="72" text-anchor="middle" font-size="11.5" fill="#5a6270">其他 23 站 37%</text><text x="40" y="44" font-size="12" fill="#2a313d" font-weight="700">借出 dep = 12.38 辆　→ 按 29 个站的份额切开</text><rect x="40.0" y="120" width="61.5" height="32" fill="#0d9488" opacity="0.88"/><text x="70.8" y="140" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="700">3014</text><line x1="101.5" y1="120" x2="101.5" y2="152" stroke="#fff" stroke-width="1.5"/><rect x="101.5" y="120" width="9.1" height="32" fill="#2563eb" opacity="0.88"/><line x1="110.7" y1="120" x2="110.7" y2="152" stroke="#fff" stroke-width="1.5"/><rect x="110.7" y="120" width="15.2" height="32" fill="#7c3aed" opacity="0.88"/><line x1="125.9" y1="120" x2="125.9" y2="152" stroke="#fff" stroke-width="1.5"/><rect x="125.9" y="120" width="3.1" height="32" fill="#ea580c" opacity="0.88"/><line x1="129.0" y1="120" x2="129.0" y2="152" stroke="#fff" stroke-width="1.5"/><rect x="129.0" y="120" width="10.2" height="32" fill="#c026d3" opacity="0.88"/><line x1="139.1" y1="120" x2="139.1" y2="152" stroke="#fff" stroke-width="1.5"/><rect x="139.1" y="120" width="7.1" height="32" fill="#b45309" opacity="0.88"/><line x1="146.3" y1="120" x2="146.3" y2="152" stroke="#fff" stroke-width="1.5"/><rect x="146.3" y="120" width="285.7" height="32" fill="#dde1e8"/><text x="289.1" y="140" text-anchor="middle" font-size="11.5" fill="#5a6270">其他 23 站 73%</text><text x="40" y="112" font-size="12" fill="#2a313d" font-weight="700">归还 arr = 8.44 辆　→ 按 29 个站的份额切开</text><text x="452" y="62" font-size="11.5" fill="#9aa1ad">站</text><text x="534" y="62" font-size="11.5" fill="#9aa1ad" text-anchor="end">借出占比</text><text x="602" y="62" font-size="11.5" fill="#9aa1ad" text-anchor="end">归还占比</text><text x="662" y="62" font-size="11.5" fill="#9aa1ad" text-anchor="end">净流</text><rect x="452" y="69" width="8" height="8" rx="2" fill="#0d9488"/><text x="466" y="78" font-size="11.5" fill="#2a313d" font-weight="700">3014</text><text x="534" y="78" font-size="11.5" fill="#6f7887" text-anchor="end">19.6%</text><text x="602" y="78" font-size="11.5" fill="#6f7887" text-anchor="end">15.7%</text><text x="662" y="78" font-size="11.5" text-anchor="end" font-weight="700" fill="#dc2626">-1.10</text><rect x="452" y="90" width="8" height="8" rx="2" fill="#2563eb"/><text x="466" y="99" font-size="11.5" fill="#2a313d" font-weight="700">3022</text><text x="534" y="99" font-size="11.5" fill="#6f7887" text-anchor="end">10.6%</text><text x="602" y="99" font-size="11.5" fill="#6f7887" text-anchor="end">2.3%</text><text x="662" y="99" font-size="11.5" text-anchor="end" font-weight="700" fill="#dc2626">-1.12</text><rect x="452" y="111" width="8" height="8" rx="2" fill="#7c3aed"/><text x="466" y="120" font-size="11.5" fill="#2a313d" font-weight="700">3082</text><text x="534" y="120" font-size="11.5" fill="#6f7887" text-anchor="end">10.0%</text><text x="602" y="120" font-size="11.5" fill="#6f7887" text-anchor="end">3.9%</text><text x="662" y="120" font-size="11.5" text-anchor="end" font-weight="700" fill="#dc2626">-0.92</text><rect x="452" y="132" width="8" height="8" rx="2" fill="#ea580c"/><text x="466" y="141" font-size="11.5" fill="#2a313d" font-weight="700">3066</text><text x="534" y="141" font-size="11.5" fill="#6f7887" text-anchor="end">8.2%</text><text x="602" y="141" font-size="11.5" fill="#6f7887" text-anchor="end">0.8%</text><text x="662" y="141" font-size="11.5" text-anchor="end" font-weight="700" fill="#dc2626">-0.95</text><rect x="452" y="153" width="8" height="8" rx="2" fill="#c026d3"/><text x="466" y="162" font-size="11.5" fill="#2a313d" font-weight="700">3042</text><text x="534" y="162" font-size="11.5" fill="#6f7887" text-anchor="end">7.9%</text><text x="602" y="162" font-size="11.5" fill="#6f7887" text-anchor="end">2.6%</text><text x="662" y="162" font-size="11.5" text-anchor="end" font-weight="700" fill="#dc2626">-0.76</text><rect x="452" y="174" width="8" height="8" rx="2" fill="#b45309"/><text x="466" y="183" font-size="11.5" fill="#2a313d" font-weight="700">3068</text><text x="534" y="183" font-size="11.5" fill="#6f7887" text-anchor="end">6.1%</text><text x="602" y="183" font-size="11.5" fill="#6f7887" text-anchor="end">1.8%</text><text x="662" y="183" font-size="11.5" text-anchor="end" font-weight="700" fill="#dc2626">-0.61</text><line x1="40" y1="222" x2="640" y2="222" stroke="#e6e8ee"/><text x="40" y="248" font-size="12" fill="#2a313d">3014 净流 = 8.44×15.7% − 12.38×19.6% = 1.33 − 2.43 = <tspan fill="#dc2626" font-weight="700">−1.10 辆</tspan></text><text x="40" y="272" font-size="11.5" fill="#6f7787">两套份额各自求和都等于 100%，所以 29 个站的净流相加 = 片区净流（−3.94），一个数都不会多</text><text x="40" y="294" font-size="11.5" fill="#9aa1ad">注意 3022：借出占 10.6%、归还只占 2.3% —— 缺口不是「车多车少」，是「借还结构不对称」</text></svg>